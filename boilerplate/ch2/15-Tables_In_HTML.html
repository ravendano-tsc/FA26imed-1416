<!DOCTYPE html>
<html lang="en-US">
<head>
 <title>15 Tables In HTML</title>
 <link rel="stylesheet"  type="css/text" href="./includes/css/stylesheet.css">
 <script src="./includes/javascript/javascript.js"> </script>
</head>

<body>
<header></header>
<nav> <!-- Navigation Section -->
 <ul>
	<li><a href="./">Chapter 02 Homepage</a></li>
 </ul>
</nav>

<section> <!-- main body portion of site -->

<h4 style="text-align:center;">Horizontal Table</h4>

<table border="1">
  <thead><b>Product Information</b></thead>  
  <tbody>
    <tr>
      <th>Product</th>
      <th>Quantity</th>
      <th>Price</th>
    </tr>
    <tr>
      <td>Ladies Shoes</td>
      <td>1</td>
      <td>$99.99</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td><b>Total</b></td>
      <td>1</td>
      <td>$99.99</td>
    </tr>
  </tfoot>
</table>

</section>

<footer>
 <nav> <!-- This is the site map -->
  <ul>
	<li><a href="./">Chapter 02 Homepage</a></li>
  </ul>
 </nav>
</footer>
</body>

</html>
